<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>QIP 16×16 logo</title>
  <rect width="16" height="16" fill="#08172b"/>

  <g fill="#009bca">
    <!-- Q: a square counter with a centered tail. -->
    <rect x="0" y="5" width="5" height="1"/>
    <rect x="0" y="6" width="1" height="3"/>
    <rect x="4" y="6" width="1" height="3"/>
    <rect x="0" y="8" width="5" height="1"/>
    <rect x="2" y="9" width="1" height="2"/>

    <!-- I: capped vertical stroke. -->
    <rect x="6" y="5" width="3" height="1"/>
    <rect x="7" y="6" width="1" height="2"/>
    <rect x="6" y="8" width="3" height="1"/>

    <!-- P: square bowl, open below the middle bar. -->
    <rect x="10" y="5" width="1" height="6"/>
    <rect x="10" y="5" width="5" height="1"/>
    <rect x="14" y="6" width="1" height="3"/>
    <rect x="10" y="8" width="5" height="1"/>
  </g>
</svg>
